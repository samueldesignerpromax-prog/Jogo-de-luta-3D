<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚔️ NINJA LEGENDS - Jogo de Luta 3D ⚔️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }
        
        /* UI Principal */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        
        /* Barras de Vida */
        .health-container {
            position: absolute;
            background: linear-gradient(135deg, rgba(0,0,0,0.85), rgba(0,0,0,0.7));
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 12px 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            min-width: 250px;
            pointer-events: auto;
        }
        
        .player-health {
            top: 20px;
            left: 20px;
        }
        
        .enemy-health {
            top: 20px;
            right: 20px;
        }
        
        .health-label {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-health .health-label {
            color: #ff6b6b;
        }
        
        .enemy-health .health-label {
            color: #ffaa44;
        }
        
        .health-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        
        .health-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        
        .player-health .health-fill {
            background: linear-gradient(90deg, #ff6b6b, #ff3b3b);
        }
        
        .enemy-health .health-fill {
            background: linear-gradient(90deg, #ffaa44, #ff7700);
        }
        
        .health-value {
            font-size: 12px;
            color: #ccc;
            text-align: right;
        }
        
        /* Pontuação */
        #score-container {
            position: absolute;
            top: 100px;
            left: 20px;
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(0,0,0,0.6));
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px 20px;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.3);
            pointer-events: auto;
        }
        
        #score-label {
            color: #ffd700;
            font-size: 11px;
            letter-spacing: 2px;
        }
        
        #score-value {
            color: #ffd700;
            font-size: 28px;
            font-weight: bold;
            line-height: 1;
        }
        
        #combo-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }
        
        #combo-text {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.7);
            padding: 5px 15px;
            border-radius: 30px;
            display: inline-block;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        /* Controles */
        #controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 12px;
            color: #ccc;
            font-family: monospace;
            pointer-events: auto;
        }
        
        .control-group {
            display: inline-block;
            margin-right: 20px;
        }
        
        .control-key {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
            color: #ffd700;
            margin-right: 5px;
        }
        
        /* Efeitos visuais */
        #damage-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0) 0%, rgba(255,0,0,0.4) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 999;
        }
        
        #combat-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 1000;
        }
        
        /* Tela de Game Over */
        #gameover-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(0,0,0,0.9));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 2px solid #ff3b3b;
            pointer-events: auto;
            z-index: 2000;
            min-width: 400px;
            display: none;
            flex-direction: column;
            align-items: center;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        
        #gameover-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        #gameover-screen .victory {
            color: #ffd700;
        }
        
        #gameover-screen .defeat {
            color: #ff3b3b;
        }
        
        #gameover-screen p {
            color: white;
            font-size: 18px;
            margin: 10px 0;
        }
        
        #gameover-screen button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        
        #gameover-screen button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        
        /* Dano flutuante */
        .floating-damage {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 1000;
            text-shadow: 1px 1px 0 black;
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-60px);
                opacity: 0;
            }
        }
        
        /* Barra de carregamento */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10000;
        }
        
        .loader {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .loader-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd700);
            animation: loading 2s ease-out forwards;
        }
        
        @keyframes loading {
            to { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>⚔️ CARREGANDO JOGO ⚔️</h2>
        <div class="loader">
            <div class="loader-fill"></div>
        </div>
        <p style="margin-top: 10px;">Preparando a batalha...</p>
    </div>

    <div id="ui" style="display: none;">
        <div class="health-container player-health">
            <div class="health-label">
                🥷 NINJA GUERREIRO
            </div>
            <div class="health-bar-bg">
                <div class="health-fill" id="player-health-fill"></div>
            </div>
            <div class="health-value" id="player-health-value">100%</div>
        </div>
        
        <div class="health-container enemy-health">
            <div class="health-label">
                👹 SAMURAI SOMBRA
            </div>
            <div class="health-bar-bg">
                <div class="health-fill" id="enemy-health-fill"></div>
            </div>
            <div class="health-value" id="enemy-health-value">100%</div>
        </div>
        
        <div id="score-container">
            <div id="score-label">🏆 PONTUAÇÃO</div>
            <div id="score-value">0</div>
        </div>
        
        <div id="combo-container">
            <div id="combo-text">0x COMBO!</div>
        </div>
        
        <div id="controls-info">
            <div class="control-group">
                <span class="control-key">WASD</span>
                <span>Movimento</span>
            </div>
            <div class="control-group">
                <span class="control-key">ESPACE</span>
                <span>Ataque</span>
            </div>
            <div class="control-group">
                <span class="control-key">SHIFT</span>
                <span>Correr</span>
            </div>
            <div class="control-group">
                <span class="control-key">R</span>
                <span>Reiniciar</span>
            </div>
        </div>
        
        <div id="damage-overlay"></div>
        <div id="combat-text">⚡ PERFEITO ⚡</div>
        
        <div id="gameover-screen">
            <h1 id="gameover-title">💀 GAME OVER 💀</h1>
            <p id="gameover-message">Fim da batalha...</p>
            <p id="gameover-stats"></p>
            <button onclick="location.reload()">⚔️ REINICIAR JOGO ⚔️</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module" src="game.js"></script>
</body>
</html>
